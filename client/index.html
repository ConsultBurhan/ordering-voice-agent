<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Ordering Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app-card">
      <!-- Header -->
      <header class="app-header">
        <div class="brand">
          <div class="brand-icon">🎙️</div>
          <div>
            <h1>Voice Ordering Agent</h1>
            <p class="subtitle">Real-time voice ordering pipeline</p>
          </div>
        </div>
        <div class="status-badge" id="status-badge">
          <span class="status-dot" id="status-dot"></span>
          <span id="connection-status">Disconnected</span>
        </div>
      </header>

      <!-- Orb Visualizer Section -->
      <div class="visualizer-container">
        <div class="orb-wrapper">
          <div class="orb" id="voice-orb">
            <div class="orb-inner"></div>
            <div class="orb-pulse"></div>
          </div>
        </div>
        <div class="state-caption" id="state-caption">Click Connect to Start</div>
      </div>

      <!-- Controls -->
      <div class="controls-bar">
        <button id="connect-btn" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          Connect Agent
        </button>
        <button id="disconnect-btn" class="btn btn-danger" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Disconnect
        </button>
      </div>

      <!-- Audio Element -->
      <audio id="bot-audio" autoplay></audio>

      <!-- Chat / Transcript Section -->
      <div class="section-title">Conversation</div>
      <div class="transcript-box" id="transcript-box">
        <div class="empty-state" id="empty-state">
          No messages yet. Start a session and speak into your microphone.
        </div>
      </div>

      <!-- Debug / Event Logs Toggle & Box -->
      <details class="logs-details">
        <summary>System & Event Logs</summary>
        <div class="debug-panel">
          <div id="debug-log"></div>
        </div>
      </details>
    </div>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
