<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Bistro - AI Voice Ordering Kiosk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="kiosk-app-container">
      <!-- Top Brand Header -->
      <header class="kiosk-header">
        <div class="brand">
          <div class="brand-badge-icon">👑</div>
          <div class="brand-text">
            <h1 class="brand-title">BURGER KING</h1>
            <span class="brand-sub">AI Voice Drive-Thru & Kiosk Station</span>
          </div>
        </div>

        <div class="header-status-area">
          <div class="status-badge disconnected" id="status-badge">
            <span class="status-dot" id="status-dot"></span>
            <span id="connection-status">Offline</span>
          </div>
        </div>
      </header>

      <!-- Main Kiosk Body Layout -->
      <main class="kiosk-main-layout">
        <!-- Avatar Stage & Controls -->
        <section class="stage-section">
          <!-- Avatar Center Stage -->
          <div class="avatar-center-stage" id="avatar-container-root">
            <!-- Rendered by Avatar.ts -->
          </div>

          <!-- Soundwave Visualizer -->
          <div class="visualizer-bar-area" id="visualizer-root">
            <!-- Rendered by Visualizer.ts -->
          </div>

          <!-- Controls Bar -->
          <div class="controls-bar">
            <button id="connect-btn" class="btn btn-connect">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
              </svg>
              Start Voice Ordering
            </button>
            <button id="disconnect-btn" class="btn btn-disconnect" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
              End Session
            </button>
          </div>

          <!-- Conversation Transcript Box -->
          <div class="transcript-wrapper">
            <div class="section-label">
              <span>Speech & Dialogue Log</span>
            </div>
            <div class="transcript-box" id="transcript-box">
              <div class="empty-state" id="empty-state">
                <div class="empty-mic-icon">🎙️</div>
                <p>Click <strong>"Start Voice Ordering"</strong> and speak your order clearly.</p>
              </div>
            </div>
          </div>
        </section>
      </main>

      <!-- Audio Element for Bot Voice Stream -->
      <audio id="bot-audio" autoplay></audio>

      <!-- Bottom Debug Drawer -->
      <footer class="kiosk-footer">
        <details class="logs-details">
          <summary>🔍 System Event Logs & Diagnostics</summary>
          <div class="debug-panel">
            <div id="debug-log"></div>
          </div>
        </details>
      </footer>
    </div>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
